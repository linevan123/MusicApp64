name: Bounce

options:
  bundleIdPrefix: com.prodbyevan
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  findCarthageFrameworks: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2" # 1: iPhone, 2: iPad
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_OPTIMIZATION_LEVEL: "s"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: "s"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

targets:
  Bounce:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    
    sources:
      - path: Bounce
        excludes:
          - "Info.plist"
          
    info:
      path: Bounce/Info.plist
      
    dependencies:
      # Backend-as-a-Service (Supabase Swift SDK for Auth, Database & Storage)
      - package: Supabase
        product: Supabase
      # System Audio & Media Frameworks
      - framework: AVFoundation.framework
      - framework: MediaPlayer.framework
      - framework: Accelerate.framework
      - framework: UniformTypeIdentifiers.framework
      - framework: Combine.framework
      - framework: SwiftUI.framework
      
    settings:
      base:
        PRODUCT_NAME: "Bounce"
        PRODUCT_BUNDLE_IDENTIFIER: com.prodbyevan.bounce
        INFOPLIST_FILE: Bounce/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        DEVELOPMENT_TEAM: "" # Set your Apple Developer Team ID here
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Audio background execution
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

schemes:
  Bounce:
    build:
      targets:
        Bounce: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
